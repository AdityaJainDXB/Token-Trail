name: Build Mac app

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm test
      - name: Match package version to the tag
        if: startsWith(github.ref, 'refs/tags/')
        run: npm version "${TAG#v}" --no-git-tag-version --allow-same-version
        env:
          TAG: ${{ github.ref_name }}
      - name: Stop Spotlight indexing so disk images can detach
        run: sudo mdutil -a -i off || true
      - name: Build DMGs and update zips
        # One architecture at a time, retried: building both at once leaves two "Token Trail" disk
        # images mounted together and hdiutil detach fails intermittently on the runner.
        run: |
          for arch in arm64 x64; do
            for attempt in 1 2 3; do
              npx electron-builder --mac --$arch --publish never && break
              [ "$attempt" = 3 ] && exit 1
              echo "Build for $arch failed (attempt $attempt), retrying"; sleep 15
            done
          done
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: mac-builds
          path: |
            dist/*.dmg
            dist/*.zip
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          gh release create "$TAG" dist/*.dmg dist/*.zip --title "Token Trail $TAG" --generate-notes \
            || gh release upload "$TAG" dist/*.dmg dist/*.zip --clobber
          gh release edit "$TAG" --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
